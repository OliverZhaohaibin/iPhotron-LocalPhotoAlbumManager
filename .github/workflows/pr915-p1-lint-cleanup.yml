name: PR 915 P1 lint cleanup

on:
  push:
    branches:
      - tmp/pr915-p1-lint-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove obsolete species local
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/iPhoto/pets/repository.py")
          text = path.read_text(encoding="utf-8")
          obsolete = "            detection_species = _normalize_species_label(detection.species_label)\n"
          if obsolete not in text:
              raise SystemExit("obsolete detection_species line not found")
          path.write_text(text.replace(obsolete, "", 1), encoding="utf-8")

      - name: Validate cleanup
        run: |
          python -m compileall -q src/iPhoto/pets/repository.py
          git diff --check

      - name: Commit and push PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/iPhoto/pets/repository.py
          git commit -m "fix: remove obsolete pet species local"
          git push origin HEAD:fix-pets-mixed-species-issue

      - name: Remove temporary branch
        if: success()
        run: git push origin --delete tmp/pr915-p1-lint-cleanup
