name: PR 915 P1 fix

on:
  pull_request:
    branches: [edit-base]

permissions:
  contents: write

jobs:
  fix-test-push:
    if: github.event.pull_request.head.ref == 'fix-pets-mixed-species-issue'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-pets-mixed-species-issue
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Finalize P1 fix and regression coverage
        shell: python
        run: |
          from pathlib import Path

          repository_path = Path("src/iPhoto/pets/repository.py")
          repository_text = repository_path.read_text(encoding="utf-8")
          unused_species_line = (
              "            detection_species = _normalize_species_label(detection.species_label)\n"
          )
          repository_text = repository_text.replace(unused_species_line, "", 1)

          old_guard = (
              "            if candidate_id and not _species_compatible(detection_species, known_species):\n"
              "                candidate_id = \"\"\n"
              "            elif candidate_id and candidate_id not in existing_pets and durable_profile is None:\n"
              "                candidate_id = \"\"\n"
              "            elif candidate_id and any(\n"
          )
          new_guard = (
              "            # An exact durable pet-key mapping is an identity anchor. Species\n"
              "            # compatibility remains an automatic matching constraint, but it must\n"
              "            # not undo a previously persisted/manual cross-species assignment.\n"
              "            if candidate_id and candidate_id not in existing_pets and durable_profile is None:\n"
              "                candidate_id = \"\"\n"
              "            elif candidate_id and any(\n"
          )
          if old_guard in repository_text:
              repository_text = repository_text.replace(old_guard, new_guard, 1)
          if new_guard not in repository_text:
              raise SystemExit("durable pet-key identity guard is not in the expected state")
          repository_path.write_text(repository_text, encoding="utf-8")

          test_path = Path("tests/test_pet_remediation_contracts.py")
          test_text = test_path.read_text(encoding="utf-8")
          if 'rescanned_cat = replace(' not in test_text:
              marker = (
                  "    assert f\"Preserving mixed-species Pet identity {dog_identity}\" in caplog.text\n"
                  "\n\n"
                  "def test_profile_candidate_index_has_strict_species_parity_with_usearch(\n"
              )
              added_case = (
                  "    assert f\"Preserving mixed-species Pet identity {dog_identity}\" in caplog.text\n"
                  "\n"
                  "    # The non-dominant species member must also keep the durable identity.\n"
                  "    # This is the regression case that previously fell through the species gate.\n"
                  "    caplog.clear()\n"
                  "    rescanned_cat = replace(\n"
                  "        _detection(\"cat-rescan\", asset_id=\"asset-cat\"),\n"
                  "        pet_key=cat.pet_key,\n"
                  "        species_label=\"cat\",\n"
                  "    )\n"
                  "    cat_event = coordinator.submit_detected_batch(\n"
                  "        [DetectedAssetPets(\"asset-cat\", \"album/asset-cat.jpg\", [rescanned_cat])],\n"
                  "        distance_threshold=0.1,\n"
                  "    )\n"
                  "\n"
                  "    assert cat_event is not None\n"
                  "    assert cat_event.updated_pet_ids == (dog_identity,)\n"
                  "    assert repository.get_detection(\"cat\") is None\n"
                  "    assert repository.get_detection(\"cat-rescan\").pet_id == dog_identity  # type: ignore[union-attr]\n"
                  "    assert repository.get_detection(\"dog-rescan\").pet_id == dog_identity  # type: ignore[union-attr]\n"
                  "    assert {pet.pet_id for pet in repository.get_all_pet_records()} == {dog_identity}\n"
                  "    assert cat_event.operation_id is not None\n"
                  "    assert repository.get_runtime_commit(cat_event.operation_id)[\"state_synced\"] is True  # type: ignore[index]\n"
                  "    assert coordinator._journal.unfinished() == ()\n"
                  "    assert f\"Preserving mixed-species Pet identity {dog_identity}\" in caplog.text\n"
                  "\n\n"
                  "def test_profile_candidate_index_has_strict_species_parity_with_usearch(\n"
              )
              if marker not in test_text:
                  raise SystemExit("expected regression-test insertion point not found")
              test_text = test_text.replace(marker, added_case, 1)
              test_path.write_text(test_text, encoding="utf-8")

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libpulse0

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" "usearch>=2.26,<3"

      - name: Validate fix
        env:
          QT_QPA_PLATFORM: offscreen
          NUMBA_DISABLE_JIT: "1"
        run: |
          python -m compileall -q src/iPhoto/pets/repository.py tests/test_pet_remediation_contracts.py
          git diff --check
          python -m ruff check src/iPhoto/pets/repository.py tests/test_pet_remediation_contracts.py
          python -m pytest -q tests/test_pet_remediation_contracts.py -k "incremental_rescan_preserves_manual_cross_species_identity or manual_actions_override_generation_contract or cross_species_move_succeeds_and_journal_is_finalized or unstable_profile_only_reuses_identity_by_exact_pet_key"

      - name: Commit and push fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/pr915-p1-fix.yml
          git add -- src/iPhoto/pets/repository.py tests/test_pet_remediation_contracts.py
          git diff --cached --check
          git commit -m "fix: preserve manual mixed-species pet assignments"
          git push origin HEAD:fix-pets-mixed-species-issue
