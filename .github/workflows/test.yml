name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libpulse0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          NUMBA_DISABLE_JIT: "1"
        run: |
          python tools/check_architecture.py
          python -m compileall -q src tools
          python -m pytest tests/ --tb=short -v
          git diff --check

  startup-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libpulse0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run cross-platform startup contracts
        env:
          QT_QPA_PLATFORM: offscreen
          NUMBA_DISABLE_JIT: "1"
        run: >-
          python -m pytest -q
          tests/application/test_library_probe.py
          tests/application/test_library_session.py
          tests/application/test_runtime_context.py
          tests/gui/test_startup_orchestrator.py
          tests/gui/test_gui_startup_job_queue.py
          tests/gui/test_startup_import_boundary.py
          tests/test_library_bind_double_scan.py
          tests/test_startup_benchmark.py
